name: MLOps Pipeline CI

on:
  push:
    paths:
      - 'mlops/**'
      - '.github/workflows/mlops_ci.yml'
  pull_request:
    paths:
      - 'mlops/**'

jobs:
  validate-kfp-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install MLOps Dependencies
        run: |
          pip install --upgrade pip
          pip install kfp google-cloud-aiplatform sqlglot pandas

      - name: Compile Kubeflow Pipeline Specification
        run: |
          python mlops/pipelines/pipeline.py
          test -f treasury_pipeline.yaml && echo "KFP Pipeline specification generated successfully!"
