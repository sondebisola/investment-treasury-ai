name: Treasury AI Pipeline CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validate SQL Parser Unit Tests
      run: |
        python -c "from agent_core.validators.sql_parser import validate_sql_ast; ok, _ = validate_sql_ast('SELECT * FROM fct_liquidity_summary'); assert ok"
        echo "AST Parser validation passed!"

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Format Check
      run: terraform fmt -check terraform/
