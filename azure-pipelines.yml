trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Validation_Quality_Checks
  displayName: '1. Validation & Quality Checks'
  jobs:
  - job: Run_dbt_AST_Parser
    displayName: 'Run dbt & AST Parser Tasks'
    steps:
    - checkout: self
    - script: |
        echo "Running dbt & AST Parser checks..."
        # Add your dbt / AST parser execution commands here
      displayName: 'Execute dbt & AST Parser'

- stage: Terraform_IaC_Checks
  displayName: '2. Terraform IaC Checks'
  dependsOn: Validation_Quality_Checks
  jobs:
  - job: Verify_Terraform_Formatting
    displayName: 'Verify Terraform Formatting'
    steps:
    - checkout: self

    # Step to install Terraform on the hosted agent
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    # Step to check formatting
    - script: |
        terraform fmt -check -recursive
      displayName: 'Verify Terraform Formatting'
